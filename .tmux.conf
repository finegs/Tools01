# ==========================================
#  General Settings
# ==========================================
# Use screen-256color inside tmux (safest for compatibility)
set -g default-terminal "screen-256color"

# Wildcard overrides to force True Color (Tc) and RGB support 
# for whatever terminal is running outside of tmux
# set -ag terminal-overrides ",*-256color:Tc"
# set -ag terminal-overrides ",*-256color:RGB"

# Enable mouse support (clickable windows, panes, resizable panes)
# NOTE FOR PUTTY: Hold 'Shift' while clicking and dragging to copy text normally!
set -g mouse on

# Start windows and panes at 1, not 0 (easier to reach on the keyboard)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Zero-out escape time delay for quicker response (useful for Vim users)
set -s escape-time 0

# Enable Vi keys for navigating copy mode, scrollback, and menus (like the help menu)
set-window-option -g mode-keys vi

# Enable Vi keys for the tmux command prompt (Prefix + :)
set-option -g status-keys vi

# # Enable mouse support for selection and scrolling
# set -g mouse on
#
# # Use vim-style keybindings in copy mode
# setw -g mode-keys vi
#
# Sync tmux copy mode with Windows clipboard via clip.exe
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"


# ==========================================
#  Keybindings
# ==========================================

# Unbind the default prefix (Ctrl-b) and set it to Ctrl-a (easier to reach)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Reload tmux configuration
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and - (much more intuitive than % and ")
# Also open new panes in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new windows in the current directory
bind c new-window -c "#{pane_current_path}"

# Navigate panes using Vim-style keys (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift + Arrow keys
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Up resize-pane -U 2
bind -n S-Down resize-pane -D 2

# ==========================================
#  Plugins (Tmux Plugin Manager)
# ==========================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'             # Plugin manager
set -g @plugin 'tmux-plugins/tmux-sensible'   # Sane default settings
set -g @plugin 'tmux-plugins/tmux-resurrect'  # Persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum'  # Automatically save sessions every 15 mins
set -g @plugin 'jimeh/tmux-themepack'         # Clean themes
set -g @plugin 'erikw/tmux-powerline'


# Plugin configurations
# set -g @themepack 'powerline/default/cyan'    # Sleek bottom status bar theme
set -g @resurrect-capture-pane-contents 'on'  # Restore pane contents
set -g @continuum-restore 'on'                # Restore last saved environment automatically

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
